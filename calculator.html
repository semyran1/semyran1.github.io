<style>
/* Визуальный язык портфолио semyran1.github.io и его brief.html:
   тёплая бумага, чернила, один жёлтый акцент, рамки 1px без скруглений, жёсткие тени, Manrope + JetBrains Mono. */
:root{
  --bg:#f7f5f0; --plate:#fcfbf8; --ink:#141311; --soft:#3c382f; --gray:#6a6558;
  --line:rgba(20,19,17,.14); --line2:rgba(20,19,17,.07);
  --acc:#ffe600; --on-acc:#141311; --hl:#ffe600; --hl-fg:inherit; --red:#c8321f; --ok:#2f6b3a;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:Manrope,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0e0d; --plate:#171715; --ink:#f3f1ea; --soft:#d3cec1; --gray:#a29c8d;
  --line:rgba(243,241,234,.16); --line2:rgba(243,241,234,.08);
  --hl:transparent; --hl-fg:#ffe600; --red:#ff7f6e; --ok:#8fd19b; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e0e0d; --plate:#171715; --ink:#f3f1ea; --soft:#d3cec1; --gray:#a29c8d;
  --line:rgba(243,241,234,.16); --line2:rgba(243,241,234,.08);
  --hl:transparent; --hl-fg:#ffe600; --red:#ff7f6e; --ok:#8fd19b; color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:24px}
@media(max-width:560px){.wrap{padding-inline:16px}}

/* шапка */
header{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hrow{display:flex;justify-content:space-between;align-items:center;height:56px;gap:16px}
.logo{font-weight:800;font-size:17px;text-decoration:none;letter-spacing:-.02em}
.logo i{font-style:normal;color:var(--acc);-webkit-text-stroke:1px var(--ink)}
.hr{display:flex;gap:18px;align-items:center}
.back,.lang{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--gray);text-decoration:none}
.back:hover,.lang:hover{color:var(--ink)}
.lang{border:1px solid var(--line);padding:4px 9px}
.lang:hover{border-color:var(--ink)}
@media(max-width:520px){.back{display:none}}
body.embed header,body.embed .hero,body.embed .about-top{display:none}

main{padding-block:48px 120px}
body.embed main{padding-top:16px}
.num{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--on-acc);background:var(--acc);padding:3px 8px;letter-spacing:.06em;display:inline-block;transform:rotate(-1deg)}
h1{font-weight:800;font-size:clamp(28px,4.6vw,44px);line-height:1.1;letter-spacing:-.02em;margin-top:14px;text-wrap:balance}
h2{font-weight:800;font-size:clamp(21px,2.6vw,26px);line-height:1.2;letter-spacing:-.01em;margin-top:12px;text-wrap:balance}
u{text-decoration:none;background:linear-gradient(transparent 62%,var(--hl) 62%);color:var(--hl-fg);padding:0 .05em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sub{color:var(--gray);margin-top:10px;max-width:640px}
.hero{max-width:760px}

label,.lbl{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);margin-bottom:9px}
.hint{font-family:var(--mono);font-size:11px;color:var(--gray);margin-top:10px;line-height:1.7}
.hint b{color:var(--ink)}
.cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);margin:0 0 12px;display:flex;align-items:center;gap:12px;font-weight:400}
.cap::after{content:"";flex:1;height:1px;background:var(--line)}

/* кто делает: короткая карточка под заголовком */
.about-top{margin-top:26px;border:1px solid var(--ink);background:var(--plate);padding:16px 18px;display:flex;gap:10px 22px;flex-wrap:wrap;align-items:baseline;max-width:760px}
.about-top p{flex:1 1 380px;font-size:15.5px;color:var(--soft);min-width:0}
.about-top p b{color:var(--ink)}
.about-top .links{display:flex;gap:8px 18px;flex-wrap:wrap;flex-basis:100%;font-family:var(--mono);font-size:11.5px}
.about-top .links a{text-decoration:none;border-bottom:1px solid var(--ink)}
.about-top .links a:hover{background:var(--acc);color:var(--on-acc)}
.proc{list-style:none;margin-top:14px;border:1px solid var(--ink);background:var(--plate)}
.proc li{display:flex;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.proc li:last-child{border-bottom:0}
.pn{font-family:var(--mono);font-size:11px;font-weight:700;background:var(--acc);color:var(--on-acc);width:24px;height:24px;display:grid;place-items:center;flex:none;transform:rotate(-2deg)}
.proc b{display:block;font-weight:800;font-size:15.5px;line-height:1.3}
.proc small{display:block;font-size:13.5px;color:var(--gray);margin-top:2px;line-height:1.45}
.chk small{display:block;font-size:13px;color:var(--gray);margin-top:3px;line-height:1.45}
.chk .pr{font-family:var(--mono);font-style:normal;font-size:11.5px;font-weight:700;white-space:nowrap}
.mailline{font-family:var(--mono);font-size:11.5px;color:var(--gray);margin-top:16px}
.mailline a{color:var(--ink);border-bottom:1px solid var(--ink);text-decoration:none}
.facts{display:flex;gap:6px 8px;flex-wrap:wrap}
.fact{font-family:var(--mono);font-size:11px;border:1px solid var(--line);padding:3px 9px;color:var(--ink);white-space:nowrap}

.starts{margin-top:30px}
.chips{display:flex;gap:8px 10px;flex-wrap:wrap}
.chip{position:relative;font-family:var(--mono);font-size:12px;border:1px solid var(--ink);background:transparent;padding:9px 14px;cursor:pointer;transition:.15s;margin:0;text-transform:none;letter-spacing:0;color:var(--ink);display:block;text-align:left;line-height:1.35}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked){background:var(--acc);color:var(--on-acc)}
.chip:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
.chip.lite{border-color:var(--line);color:var(--gray)}
.chip.lite:hover{border-color:var(--ink);color:var(--ink)}
.chip small{display:block;font-size:10px;opacity:.7;margin-top:2px}

.grid{display:grid;grid-template-columns:1fr;gap:34px;margin-top:34px;align-items:start}
@media(min-width:960px){.grid{grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:48px}.result{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}}
body.embed .grid{margin-top:0}
.step{margin-bottom:44px}
.step>.num{margin-bottom:6px}
.step h2{margin-top:10px}
.step .sub{margin-bottom:18px}

/* вкладки групп */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
@media(max-width:520px){.tabs{grid-template-columns:1fr}}
.tab{text-align:left;border:1px solid var(--ink);background:transparent;padding:12px 14px;transition:transform .16s,box-shadow .16s,background .16s;color:var(--gray)}
.tab:hover{transform:translateY(-2px)}
.tab b{display:block;font-weight:800;font-size:16.5px;line-height:1.3;color:var(--ink)}
.tab span{display:block;font-family:var(--mono);font-size:10.5px;margin-top:5px;line-height:1.55}
.tab[aria-selected="true"]{background:var(--acc);box-shadow:4px 4px 0 var(--ink)}
.tab[aria-selected="true"] b,.tab[aria-selected="true"] span{color:var(--on-acc)}
.dirpanel{margin-top:16px;border:1px solid var(--ink);background:var(--bg);padding:0 16px 16px}
.dirpanel .ph{margin:0 -16px 14px;padding:10px 16px;background:var(--acc);color:var(--on-acc);font-family:var(--mono);font-size:11px;line-height:1.5}
.dirpanel .ph b{font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.dirpanel .opts{margin-top:0}

/* карточки-варианты */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.opts.one{grid-template-columns:1fr}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{position:relative;display:block;text-align:left;background:var(--plate);border:1px solid var(--ink);padding:14px 16px 13px;cursor:pointer;transition:transform .16s,box-shadow .16s;margin:0;text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:17px;color:var(--ink);min-width:0}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:hover{transform:translateY(-2px)}
.opt b{display:block;font-weight:800;font-size:16.5px;line-height:1.3}
.opt .d{display:block;font-family:var(--sans);font-size:14px;color:var(--gray);margin-top:5px;line-height:1.45;font-weight:400}
.opt .p{display:block;font-family:var(--mono);font-size:11px;color:var(--ink);margin-top:9px;font-weight:700}
.opt:has(input:checked){box-shadow:inset 0 0 0 1px var(--ink),6px 6px 0 var(--acc)}
.opt:has(input:checked) b::after{content:" ✓"}
.opt:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}

input[type=number],input[type=text],select{width:100%;background:var(--plate);border:1px solid var(--ink);padding:12px 14px;font:inherit;color:inherit;border-radius:0;outline:none}
input[type=number]:focus,input[type=text]:focus,select:focus{box-shadow:inset 0 0 0 1px var(--ink)}
select option{background:var(--plate);color:var(--ink)}
input.err{border-color:var(--red)!important;box-shadow:inset 0 0 0 1px var(--red)}
input[type=range]{width:100%;accent-color:var(--ink);margin:6px 0 0}
.rl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--gray);margin-top:4px}
.big{font-weight:800;font-size:20px;letter-spacing:-.01em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;align-items:end}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
.stepper{display:flex;border:1px solid var(--ink);background:var(--plate)}
.stepper button{width:46px;font-size:22px;line-height:1;border-right:1px solid var(--line)}
.stepper button:last-child{border-right:0;border-left:1px solid var(--line)}
.stepper button:hover{background:var(--acc);color:var(--on-acc)}
.stepper input{border:0;text-align:center;font-family:var(--mono);font-size:16px;box-shadow:none!important;min-width:0}
.sub2{margin-top:22px}
.chk{display:flex;gap:12px;align-items:flex-start;margin:0 0 12px;font-family:var(--sans);font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink);cursor:pointer}
.chk input{margin-top:5px;width:17px;height:17px;accent-color:var(--ink);flex:none}
.okline{border:1px dashed var(--ink);padding:12px 14px;font-size:15px;color:var(--soft);margin-top:14px}
.okline b{color:var(--ink)}
.qgroup{margin-top:22px}
.qgroup:first-child{margin-top:0}
details.more{border:1px solid var(--line);background:var(--plate)}
details.more>summary{cursor:pointer;padding:14px 16px;font-weight:800;font-size:16px;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.more>summary::after{content:"+";font-family:var(--mono);font-weight:400}
details.more[open]>summary::after{content:"−"}
details.more>summary small{display:block;font-weight:400;font-family:var(--mono);font-size:11px;color:var(--gray);margin-top:3px}
details.more .in{padding:6px 16px 18px;border-top:1px solid var(--line)}
details.more .in>div{margin-top:18px}
.hidden{display:none!important}

/* смета */
.sum{border:1px solid var(--ink);background:var(--plate)}
.sum .top{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.what{font-family:var(--mono);font-size:11px;color:var(--gray);margin-top:10px;line-height:1.7}
.biglabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);margin-top:12px}
.total{font-weight:800;font-size:clamp(38px,5vw,54px);line-height:1.05;letter-spacing:-.02em;margin-top:6px}
.per{font-family:var(--mono);font-size:11.5px;color:var(--gray);margin-top:10px;line-height:1.8}
.per b{color:var(--ink);font-weight:700}
.series{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.series>div{background:var(--plate);padding:14px 20px}
.series .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--gray)}
.series .n{font-weight:800;font-size:22px;letter-spacing:-.01em;margin-top:4px}
.series .s{font-family:var(--mono);font-size:10.5px;color:var(--gray);margin-top:2px}
.series .all{grid-column:1/-1;font-size:14px;color:var(--soft)}
.series .all b{color:var(--ink)}
.bar{display:flex;height:10px;margin:16px 0 0;border:1px solid var(--ink)}
.bar span{display:block;height:100%;min-width:0}
.bar span+span{border-left:1px solid var(--ink)}
.grp{padding:14px 20px 4px;border-bottom:1px solid var(--line)}
.grp:last-of-type{border-bottom:0}
.gh{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-weight:800;font-size:15px}
.gh i{display:inline-block;width:10px;height:10px;border:1px solid var(--ink);margin-right:9px}
.gh b{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--gray);white-space:nowrap}
.gsub{font-size:13px;color:var(--gray);margin-top:2px;line-height:1.45}
.item{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line2);align-items:baseline;margin-top:8px}
.item:first-of-type{margin-top:10px}
.item .il{min-width:0;font-size:14.5px;line-height:1.4}
.item .il small{display:block;font-size:12.5px;color:var(--gray);margin-top:2px;line-height:1.45}
.item .v{font-family:var(--mono);font-size:12px;white-space:nowrap;font-weight:700}
.item.neg .v{background:linear-gradient(transparent 55%,var(--hl) 55%);color:var(--hl-fg)}
.owner{margin:0;padding:14px 20px 16px;border-top:1px dashed var(--ink);font-family:var(--mono);font-size:11px;line-height:1.8}
.owner h3{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gray);margin-bottom:4px}
.owner .st{font-weight:700;font-size:12px}
.owner .st.bad{color:var(--red)}
.owner .st.ok{color:var(--ok)}
.owner dl{display:grid;grid-template-columns:1fr auto;gap:2px 14px;margin-top:6px;color:var(--gray)}
.owner dd{text-align:right;color:var(--ink)}
.owner hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.btn{display:inline-block;font-weight:800;font-size:15px;padding:13px 24px;border:1px solid var(--ink);background:transparent;cursor:pointer;text-decoration:none;color:inherit;transition:transform .16s;text-align:left}
.btn:hover{transform:rotate(-1deg)}
.btn.solid{background:var(--acc);border-color:var(--acc);color:var(--on-acc);box-shadow:4px 4px 0 var(--ink)}
.btn.ghost{border-color:transparent;color:var(--gray);padding-left:0}
.btn.ghost:hover{color:var(--ink);transform:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.cta{padding:18px 20px;border-top:1px solid var(--ink)}
.note{font-family:var(--mono);font-size:10.5px;color:var(--gray);line-height:1.8}

/* ниже: состав услуги, о себе, заявка */
.below{display:grid;grid-template-columns:1fr;gap:34px;margin-top:20px;padding-top:44px;border-top:1px solid var(--line)}
@media(min-width:900px){.below{grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:48px}}
.inc{list-style:none;margin-top:14px;border:1px solid var(--ink);background:var(--plate)}
.inc li{display:flex;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:15.5px;line-height:1.45}
.inc li:last-child{border-bottom:0}
.inc li::before{content:"✓";font-family:var(--mono);font-weight:700;color:var(--ok);flex:none}
.inc.no li::before{content:"×";color:var(--gray)}
.inc.no li{color:var(--soft);font-size:14.5px}
.incs{margin-top:22px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray)}
.out{margin-top:10px;font-size:15.5px;color:var(--soft)}
.send{margin-top:44px;border-top:1px solid var(--line);padding-top:44px;max-width:700px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:520px){.pair{grid-template-columns:1fr}}
.nav{display:flex;gap:14px;align-items:center;margin-top:22px;flex-wrap:wrap}
details.how{margin-top:34px;font-size:15px;color:var(--gray)}
details.how summary{cursor:pointer;color:var(--ink);font-family:var(--mono);font-size:11px;letter-spacing:.04em}
details.how p{margin-top:10px;max-width:700px}
.done{text-align:center;padding:30px 0}
.done .mark{font-size:60px;line-height:1;color:var(--acc);-webkit-text-stroke:2px var(--ink)}

/* плашка с ценой на телефоне */
.pricebar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--plate);border-top:1px solid var(--ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:none;align-items:center;justify-content:space-between;gap:12px}
.pricebar .pb{font-family:var(--mono);font-size:10.5px;color:var(--gray);line-height:1.4}
.pricebar .pv{font-weight:800;font-size:22px;line-height:1.1;letter-spacing:-.01em}
.pricebar .btn{padding:10px 16px;font-size:14px;box-shadow:3px 3px 0 var(--ink)}
@media(max-width:959px){.pricebar.on{display:flex}}
body.embed .pricebar{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* ——— мастер: три шага ——— */
.wsteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:30px;border:1px solid var(--ink);background:var(--plate)}
.ws{display:flex;gap:10px;align-items:center;text-align:left;padding:12px 14px;border-right:1px solid var(--line);color:var(--gray);cursor:default;min-width:0}
.ws:last-child{border-right:0}
.ws .n{font-family:var(--mono);font-size:11px;font-weight:700;width:24px;height:24px;display:grid;place-items:center;border:1px solid currentColor;flex:none}
.ws b{display:block;font-weight:800;font-size:15px;line-height:1.25;color:inherit}
.ws small{display:block;font-family:var(--mono);font-size:10px;margin-top:2px;line-height:1.4}
.ws.done{color:var(--ink);cursor:pointer}
.ws.done .n{background:var(--acc);color:var(--on-acc);border-color:var(--ink)}
.ws.done:hover{background:color-mix(in srgb,var(--acc) 14%,var(--plate))}

.wiz{display:grid;grid-template-columns:1fr;gap:34px;margin-top:30px;align-items:start}
@media(min-width:960px){.wiz{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px}.rail{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}}
.stp h2{margin-top:6px}
.blk{margin-top:34px}
.navrow{display:flex;gap:14px;align-items:center;margin-top:36px;flex-wrap:wrap}

.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:720px){.tabs{grid-template-columns:1fr}}
.explain{margin-top:30px;border:1px dashed var(--ink);padding:16px 18px}
.explain h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gray)}
.explain p{font-size:15px;color:var(--soft);margin-top:8px;line-height:1.55}
.explain ul{list-style:none;margin-top:8px;font-size:15px;color:var(--soft)}
.explain li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid var(--line2)}
.explain li:first-child{border-top:0}
.explain li b{font-family:var(--mono);font-size:12px;white-space:nowrap;color:var(--ink)}
.explain b{color:var(--ink)}
.freelink{margin-top:26px;font-family:var(--mono);font-size:11.5px;color:var(--gray)}
.freelink button{border-bottom:1px solid var(--gray);color:var(--ink);padding:0;font:inherit}
.freelink button:hover{background:var(--acc);color:var(--on-acc);border-color:var(--ink)}
.mixbox{margin-top:20px}
.mixbox .chips{margin-top:8px}
textarea{width:100%;background:var(--plate);border:1px solid var(--ink);padding:12px 14px;font:inherit;color:inherit;border-radius:0;outline:none;min-height:96px;resize:vertical}
textarea:focus{box-shadow:inset 0 0 0 1px var(--ink)}
textarea.err{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.rail .rows{padding:4px 20px 6px;margin:0}
.rrow{display:grid;grid-template-columns:minmax(0,92px) 1fr;gap:4px 14px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:14.5px;align-items:baseline}
.rrow:last-child{border-bottom:0}
.rrow dt{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--gray)}
.rrow dd{font-weight:700;line-height:1.35;margin:0}
.rrow dd small{display:block;font-weight:400;color:var(--gray);font-size:12.5px}
.rempty{padding:18px 20px;font-size:15px;color:var(--gray)}
.send{margin-top:44px;border-top:1px solid var(--line);padding-top:40px;max-width:none}
#stFree .send{margin-top:26px;border-top:0;padding-top:0}
.sum #groups .grp:last-of-type{border-bottom:0}

/* первый шаг: выбранный элемент сжимается, на его месте появляется новая информация */
.tab span,.tab{transition:max-height .28s ease,opacity .2s,margin .28s,padding .28s,transform .16s,box-shadow .16s,background .16s}
.tab span{max-height:7em;overflow:hidden}
.tabs.compact .tab{padding-block:9px}
.tabs.compact .tab span{max-height:0;opacity:0;margin-top:0}
.dirpanel .opts.pick{align-items:start}
.dirpanel .opts.pick .opt{transition:padding .28s ease,transform .16s,box-shadow .16s}
.dirpanel .opts.pick .opt .d{max-height:9em;overflow:hidden;transition:max-height .28s ease,opacity .2s,margin .28s}
.dirpanel.has .opts.pick .opt:not(:has(input:checked)){padding:9px 14px}
.dirpanel.has .opts.pick .opt:not(:has(input:checked)) .d{max-height:0;opacity:0;margin-top:0}
.dirpanel.has .opts.pick .opt:not(:has(input:checked)) .p{margin-top:3px}
.dirpanel.hasp .opts.pick .opt:has(input:checked) .d{max-height:0;opacity:0;margin-top:0}
.dirpanel.hasp .opts.pick .opt:has(input:checked){padding:9px 14px}
.dirpanel.hasp .opts.pick .opt:has(input:checked) .p{margin-top:3px}
.dirpanel .opts.pick .opt.wide{grid-column:1/-1}
.mixtune{margin-top:22px;padding-top:16px;border-top:1px dashed var(--ink)}
.mixtune .opts .opt{padding:10px 14px}
.mixtune .opts .opt .d{display:none}
.mixtune .opts .opt .p{margin-top:3px}
.mixtune .tsub{font-size:14px;color:var(--gray);margin:-4px 0 12px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pickcard:not(.hidden),.mixtune:not(.hidden){animation:rise .3s ease both}
.pickcard{margin-top:22px;border:1px solid var(--ink);border-left:6px solid var(--acc);background:var(--plate);padding:16px 18px}
.pickcard h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gray)}
.pickcard .pt{display:block;font-weight:800;font-size:20px;line-height:1.25;margin-top:6px}
.pickcard p{font-size:15px;color:var(--soft);margin-top:6px;line-height:1.55}
.pickcard dl{margin:10px 0 0;border-top:1px solid var(--line2)}
.pickcard dl>div{display:grid;grid-template-columns:minmax(0,96px) 1fr;gap:4px 14px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:14.5px}
.pickcard dt{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--gray);padding-top:3px}
.pickcard dd{margin:0;font-weight:600;line-height:1.4}
.pickcard .nx{font-family:var(--mono);font-size:11px;color:var(--gray);margin-top:12px;line-height:1.6}
details.explain>summary{cursor:pointer;list-style:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gray);display:flex;justify-content:space-between;gap:12px}
details.explain>summary::-webkit-details-marker{display:none}
details.explain>summary::after{content:"+";font-size:14px;line-height:1}
details.explain[open]>summary::after{content:"−"}
details.explain[open]>summary{margin-bottom:2px}
/* «кто делает» живёт справа: сначала полная карточка, после выбора сжимается */
.rail .about-top{display:block;margin-top:16px;max-width:none;padding:16px 18px}
.rail .about-top .cap{margin-bottom:8px}
.rail .about-top p{font-size:15px}

.rail .about-top .links{margin-top:12px}

@media (prefers-reduced-motion:reduce){.pickcard,.mixtune{animation:none!important}}
.softexit{margin-top:26px;padding-top:16px;border-top:1px dashed var(--line);font-family:var(--mono);font-size:11.5px;line-height:1.7;color:var(--gray)}
.softexit a{color:var(--ink);border-bottom:1px solid var(--ink);text-decoration:none}
.softexit a:hover{background:var(--acc);color:var(--on-acc)}
</style>

<body>

<header>
  <div class="wrap hrow">
    <a class="logo" id="logo" href="index.html">semyran<i>.</i></a>
    <div class="hr">
      <a class="back" id="back-link" href="index.html"></a>
      <a class="lang" id="langbtn" href="#" title="switch language / переключить язык">EN</a>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero" id="hero">
    <span class="num" id="t-num"></span>
    <h1 id="t-h1"></h1>
    <p class="sub" id="t-sub"></p>
  </section>


  <nav class="wsteps" id="wsteps" aria-label="steps">
    <button type="button" class="ws" data-go="1"><span class="n">1</span><span><b id="ws1"></b><small id="ws1s"></small></span></button>
    <button type="button" class="ws" data-go="2"><span class="n">2</span><span><b id="ws2"></b><small id="ws2s"></small></span></button>
    <button type="button" class="ws" data-go="3"><span class="n">3</span><span><b id="ws3"></b><small id="ws3s"></small></span></button>
  </nav>

  <div class="wiz">
    <form id="form" onsubmit="return false" novalidate>

      <!-- шаг 1: что снимаем -->
      <section class="stp" id="st1">
        <div style="margin-top:0">
          <span class="num" id="t-s1"></span>
          <h2 id="t-s1h"></h2>
          <p class="sub" id="t-s1sub"></p>
          <div class="tabs" role="tablist" id="tabBox"></div>
          <div class="dirpanel" id="dirBox"></div>
        </div>
        <div class="pickcard hidden" id="pick1"></div>
        <details class="explain" id="explain1"></details>
        <div style="margin-top:30px" id="presetWrap">
          <div class="cap" id="t-presets"></div>
          <div class="chips" id="presetBox"></div>
        </div>
        <div class="freelink"><span id="t-freeq"></span> <button type="button" id="freeLink"></button></div>
        <div class="starts" id="marketBox" style="margin-top:30px">
          <label class="lbl" id="t-market"></label>
          <div class="chips">
            <label class="chip"><input type="radio" name="grid" value="RU" checked><span id="t-mruh"></span></label>
            <label class="chip"><input type="radio" name="grid" value="WEST"><span id="t-mwest"></span></label>
          </div>
        </div>
      </section>

      <!-- шаг 2: какой ролик -->
      <section class="stp hidden" id="st2">
        <span class="num" id="t-s2"></span>
        <h2 id="t-s2h"></h2>
        <p class="sub" id="t-s2sub"></p>

        <div class="blk">
          <div class="cap" id="t-capLen"></div>
          <label class="lbl" for="dur" id="t-len"></label>
          <input type="range" id="dur">
          <div class="rl"><span id="rlMin"></span><span id="rlMax"></span></div>
          <div class="hint" id="t-lenhint"></div>
          <div class="sub2">
            <label class="lbl" id="t-mode"></label>
            <div class="chips" id="modeBox"></div>
            <div class="hint" id="modeHint"></div>
          </div>
          <div class="sub2" id="singleBox">
            <label class="lbl" for="count" id="countLbl"></label>
            <div class="stepper"><button type="button" data-step="count" data-d="-1" aria-label="−">−</button><input type="number" id="count" min="1" max="500" value="1" inputmode="numeric"><button type="button" data-step="count" data-d="1" aria-label="+">+</button></div>
            <div class="hint" id="volHint"></div>
          </div>
          <div class="sub2 hidden" id="seriesBox">
            <div class="row2">
              <div><label class="lbl" for="perMonth" id="t-permonth"></label>
                <div class="stepper"><button type="button" data-step="perMonth" data-d="-1" aria-label="−">−</button><input type="number" id="perMonth" min="1" max="100" value="8" inputmode="numeric"><button type="button" data-step="perMonth" data-d="1" aria-label="+">+</button></div></div>
              <div><label class="lbl" for="contractTotal" id="t-contract"></label>
                <div class="stepper"><button type="button" data-step="contractTotal" data-d="-1" aria-label="−">−</button><input type="number" id="contractTotal" min="1" max="1000" value="24" inputmode="numeric"><button type="button" data-step="contractTotal" data-d="1" aria-label="+">+</button></div></div>
            </div>
            <div class="hint" id="serHint"></div>
          </div>
        </div>

        <div class="blk">
          <div class="cap" id="t-capQ"></div>
          <div id="qBox"></div>
        </div>

        <div class="blk">
          <div class="cap" id="t-capRush"></div>
          <div class="chips" id="rushBox"></div>
        </div>

        <div class="explain" id="explain2"></div>
      </section>

      <!-- шаг 3: смета и заявка -->
      <section class="stp hidden" id="st3">
        <span class="num" id="t-s3"></span>
        <h2 id="t-s3h"></h2>
        <p class="sub" id="t-s3sub"></p>

        <div class="explain" id="mixParts" style="margin-top:22px"></div>
        <div class="sum" id="breakdown" style="margin-top:22px">
          <div class="series hidden" id="series"></div>
          <div id="groups"></div>
        </div>

        <div class="blk">
          <div class="cap" id="t-incCap"></div>
          <p class="out" id="outLine"></p>
          <ul class="inc" id="incList"></ul>
          <div class="incs" id="t-notInc"></div>
          <ul class="inc no" id="notList"></ul>
        </div>

        <div class="blk">
          <details class="more" id="moreBox">
            <summary><span><span id="t-more"></span><small id="t-moresub"></small></span></summary>
            <div class="in">
              <div><label class="lbl" for="rights" id="t-rights"></label><select id="rights"></select></div>
              <div class="row2">
                <div><label class="lbl" for="revs" id="t-revs"></label>
                  <div class="stepper"><button type="button" data-step="revs" data-d="-1" aria-label="−">−</button><input type="number" id="revs" min="0" max="5" value="0" inputmode="numeric"><button type="button" data-step="revs" data-d="1" aria-label="+">+</button></div></div>
                <div><label class="lbl" for="vers" id="t-vers"></label>
                  <div class="stepper"><button type="button" data-step="vers" data-d="-1" aria-label="−">−</button><input type="number" id="vers" min="0" max="10" value="0" inputmode="numeric"><button type="button" data-step="vers" data-d="1" aria-label="+">+</button></div></div>
              </div>
              <div><label class="chk"><input type="checkbox" id="expert"><span id="t-expert"></span></label></div>
              <div><label class="lbl" id="t-promo"></label><div id="promoBox"></div></div>
              <div id="specialBox" class="hidden"><label class="lbl" for="special">Особая скидка, % (только владелец)</label><input type="number" id="special" min="0" max="90" value="0" inputmode="numeric"><div class="hint">Отдельной строкой в смете: заказчик видит реальную цену и свою скидку.</div></div>
            </div>
          </details>
        </div>

        <div class="blk">
          <label class="lbl" for="comment" id="t-commentLbl"></label>
          <textarea id="comment"></textarea>
        </div>

        <div class="send" id="send">
          <span class="num" id="t-sendNum"></span>
          <h2 id="t-sendH"></h2>
          <p class="sub" id="t-sendSub"></p>
          <div id="leadFields" class="hidden">
            <div style="margin-top:18px"><label class="lbl" id="t-how2"></label><div class="chips" id="howBox"></div></div>
            <div class="pair">
              <div><label class="lbl" for="f-contact" id="t-contactlbl"></label><input type="text" id="f-contact" autocomplete="off"></div>
              <div><label class="lbl" for="f-name" id="t-namelbl"></label><input type="text" id="f-name" autocomplete="name"></div>
            </div>
          </div>
          <div class="nav">
            <button class="btn solid" type="button" id="send-tg"></button>
            <button class="btn" type="button" id="send-copy"></button>
            <button class="btn" type="button" id="send-mail"></button>
            <button class="btn" type="button" id="send-pdf"></button>
            <button class="btn hidden" type="button" id="send-share"></button>
          </div>
          <div class="hint" id="sendhint"></div>
          <div class="mailline" id="mailLine"></div>
        </div>

        <div class="blk" id="procBlk">
          <div class="cap" id="t-procCap"></div>
          <ol class="proc" id="procList"></ol>
        </div>

        <details class="how">
          <summary id="t-how"></summary>
          <p id="how"></p>
        </details>
      </section>

      <!-- заявка без сметы -->
      <section class="stp hidden" id="stFree">
        <span class="num" id="t-fnum"></span>
        <h2 id="t-fh"></h2>
        <p class="sub" id="t-fsub"></p>
        <div style="margin-top:20px">
          <label class="lbl" for="freeText" id="t-flbl"></label>
          <textarea id="freeText"></textarea>
        </div>
        <div id="freeHost"></div>
      </section>

      <div class="navrow" id="navrow">
        <button class="btn ghost" type="button" id="btnBack"></button>
        <button class="btn solid" type="button" id="btnNext"></button>
      </div>
      <div class="softexit hidden" id="softExit"><span id="t-softq"></span> <a href="#" id="softLink"></a></div>
    </form>

    <aside class="rail" id="rail">
      <div class="sum" id="sum">
        <div id="railTop" class="top hidden">
          <span class="num" id="t-est"></span>
          <div class="what" id="what"></div>
          <div class="biglabel" id="bigLabel"></div>
          <div class="total" id="total"></div>
          <div class="per" id="per"></div>
          <div class="bar" id="bar" aria-hidden="true"></div>
        </div>
        <div class="rempty" id="railEmpty"></div>
        <dl class="rows" id="railRows"></dl>
        <div id="owner" class="owner hidden"></div>
        <div class="note" id="disc" style="padding:0 20px 18px"></div>
      </div>
      <div class="about-top" id="aboutTop">
        <div class="cap" id="t-aboutCap"></div>
        <p id="aboutTopText"></p>
        <div class="facts" id="aboutFacts"></div>
        <div class="links" id="aboutLinks"></div>
      </div>
    </aside>
  </div>
</main>

<div class="pricebar" id="pricebar">
  <div><div class="pb" id="pbLabel"></div><div class="pv" id="pbValue"></div></div>
  <a class="btn solid" href="#" id="pbBtn"></a>
</div>

<script>
// Модель цены AI-креатора v0.3. Один источник логики для калькулятора и таблиц.

(function (root) {
  "use strict";

  function tierDiscount(cfg, total) {
    var d = 0;
    cfg.volume.tiers.forEach(function (t) { if (total >= t.from) d = t.discount; });
    return d;
  }

  function dayRateRub(cfg) {
    var o = cfg.owner;
    return (o.net_target_month_rub + o.fixed_month_rub) / (1 - o.tax_rate) / o.billable_days_month;
  }

  function direction(cfg, id) {
    return cfg.catalog.directions.filter(function (d) { return d.id === id; })[0];
  }

  // Прогрессивная шкала: каждая минута считается по ставке своего диапазона длины.
  function bracketed(grid, minutes) {
    var prod = 0, post = 0, lo = 0;
    grid.brackets.forEach(function (b) {
      var hi = b.upto_sec / 60;
      var inB = Math.max(0, Math.min(minutes, hi) - lo);
      prod += inB * b.prod_per_min;
      post += inB * b.post_per_min;
      lo = hi;
    });
    return { prod: prod, post: post };
  }

  // input: { grid, direction, durSec, count, look, hero, research, rush, contractTotal, trialDone,
  //          rights, extraRevisions, versions, expert, modules, specialDiscountPct }
  function quote(cfg, input) {
    var grid = cfg.grids[input.grid];
    var isRub = grid.currency === "RUB";
    var fx = cfg.fx.rub_per_usd;
    var step = isRub ? 100 : 5;
    var r = function (x) { return Math.round(x / step) * step; };

    var dir = direction(cfg, input.direction);
    // Переключатели, которые у направления не показываются, всегда берут значение по умолчанию.
    var look = dir.look.show && input.look ? input.look : dir.look.def;
    var heroOn = dir.hero.show && input.hero != null ? !!input.hero : dir.hero.def;
    var researchOn = dir.research === "included" || (dir.research === "optional" && !!input.research);
    var lf = cfg.factors.look[look];
    var hf = cfg.factors.hero[heroOn ? "yes" : "no"];

    var durSec = Math.min(Math.max(input.durSec, dir.sec.min), dir.sec.max);
    var count = Math.max(1, Math.round(input.count || 1));
    var minutes = Math.max(durSec, grid.min_billable_sec) / 60;
    var mods = input.modules || {};
    var rushMult = (cfg.rush.filter(function (x) { return x.id === (input.rush || "normal"); })[0] || { mult: 1 }).mult;
    // Международная сетка = российская / курс × K по типам работ: K задан у направления (west_k).
    var wk = isRub ? 1 : (dir.west_k || 1);
    var rate = dir.rate * wk;

    var genUsdPerMin = cfg.generation.base_usd_per_min * dir.gen * lf.gen * hf.gen;
    var genCostPerMin = isRub ? genUsdPerMin * fx : genUsdPerMin;

    var br = bracketed(grid, minutes);
    var pp = grid.prep;
    var perVideo = {
      prep: Math.min(pp.base + pp.per_min * minutes, pp.cap) * rate,
      prod: br.prod * lf.prod * hf.prod * rate,
      post: Math.max(br.post, grid.min_post) * rate,
      gen: minutes * genCostPerMin * (1 + cfg.generation.markup)
    };
    var discountable = perVideo.prep + perVideo.prod + perVideo.post;

    var trialDone = !!input.trialDone;
    var setup = trialDone ? 0 : grid.setup * lf.setup * hf.setup * dir.setup * wk;
    var rs = isRub ? cfg.factors.research.rub : cfg.factors.research.usd;
    var researchFee = researchOn ? count * (rs.base + rs.per_min * minutes) * wk : 0;
    var contractTotal = Math.max(count, input.contractTotal || count);
    var disc = tierDiscount(cfg, contractTotal);
    var fullCount = trialDone ? 0 : Math.min(count, cfg.volume.trial_videos);
    var discCount = count - fullCount;
    var discountAmount = discCount * discountable * disc;

    var laborAfterDisc = setup + count * discountable + researchFee - discountAmount;

    // Надбавки считаются от работы, не от генераций
    var ad = cfg.addons;
    var rightsPct = (ad.rights.filter(function (x) { return x.id === (input.rights || "base"); })[0] || { pct: 0 }).pct;
    var extraRev = Math.max(0, Math.round(input.extraRevisions || 0));
    var versions = Math.max(0, Math.round(input.versions || 0));
    var rightsAmount = laborAfterDisc * rightsPct;
    var revAmount = laborAfterDisc * ad.revision_pct * extraRev;
    var verAmount = count * (perVideo.prod + perVideo.post) * ad.version_pct * versions;
    var rushBase = laborAfterDisc + rightsAmount + revAmount + verAmount;
    var rushAmount = rushBase * (rushMult - 1);
    var expertAmount = input.expert ? (isRub ? ad.expert.rub : ad.expert.usd) : 0;
    var specialPct = Math.min(Math.max(input.specialDiscountPct || 0, 0), 100) / 100;
    var specialAmount = (rushBase + rushAmount + expertAmount) * specialPct;
    var gen = count * perVideo.gen;

    $("t-len").textContent = t("len") + ": " + durText(q.durSec);
    $("what").textContent = (m === "single" ? t("what1", { n: cnt, d: durText(q.durSec), m: dec(q.totalMinutes) + " " + t("mn"), t: pick(d.t) }) : t("what2", { d: durText(q.durSec), t: pick(d.t) }));
    $("bigLabel").textContent = S.maxStep < 2 ? t("priceNow") : (m === "single" ? t("bigLabel1") : t("bigLabel2", { n: Math.min(trial, N), u: unit(Math.min(trial, N)) }));
    $("total").innerHTML = "<u>" + money(g, q.total) + "</u>";
    $("per").innerHTML = "<b>" + money(g, q.perVideo) + "</b> " + t("perv") + " · <b>" + money(g, q.perMinute) + "</b> " + t("perm");
    $("railRows").innerHTML = railRows(q, d, g, m, cnt, N, pm);

    var S2 = $("series");
    if (mq) {
      S2.classList.remove("hidden");
      S2.innerHTML = '<div><div class="k">' + t("sPilot") + '</div><div class="n">' + money(g, q.total) + '</div><div class="s">' + t("sPer", { n: q.count, u: unit(q.count), p: money(g, q.perVideo) }) + "</div></div>" +
        '<div><div class="k">' + t("sMonth") + '</div><div class="n">' + money(g, mq.total) + '</div><div class="s">' + t("sPer", { n: mq.count, u: unit(mq.count), p: money(g, mq.perVideo) }) + "</div></div>" +
        '<div class="all">' + t("sAll", { n: N, u: unit(N), p: money(g, all.total) }) + "</div>";
    } else S2.classList.add("hidden");

    var G = q.groups, sum = G.clay + G.fingers + G.promo;
    var meta = [["clay", "var(--acc)"], ["fingers", "var(--ink)"], ["promo", "var(--gray)"]];
    $("bar").innerHTML = meta.filter(function (x) { return G[x[0]] > 0; }).map(function (x) { return '<span style="width:' + (G[x[0]] / sum * 100).toFixed(2) + "%;background:" + x[1] + '"></span>'; }).join("");
    var shown = q.lines.filter(function (l) { return l.value !== 0; });
    $("groups").innerHTML = meta.filter(function (x) { return G[x[0]] > 0; }).map(function (x) {
      var items = shown.filter(function (l) { return l.group === x[0]; }).map(function (l) {
        var ds = lineDesc(l, d.hide_gen);
        return '<div class="item' + (l.value < 0 ? " neg" : "") + '"><div class="il">' + escH(lineLabel(l, d.hide_gen)) + (ds ? "<small>" + escH(ds) + "</small>" : "") + '</div><span class="v">' + (l.value < 0 ? "−" : "") + money(g, Math.abs(l.value)) + "</span></div>";
      }).join("");
      return '<div class="grp"><div class="gh"><span><i style="background:' + x[1] + '"></i>' + escH(t("g." + x[0])) + "</span><b>" + money(g, G[x[0]]) + " · " + Math.round(G[x[0]] / sum * 100) + '%</b></div><div class="gsub">' + escH(t("g." + x[0] + ".d")) + "</div>" + items + "</div>";
    }).join("");

    var mp = $("mixParts");
    if (q.mix) {
      var sh = Math.round(q.mix.share * 100), step = g === "RU" ? 100 : 5, rr = function (x) { return Math.round(x / step) * step; };
      mp.classList.remove("hidden");
      mp.innerHTML = "<h3>" + escH(t("mixPartsH")) + "</h3><ul><li><span>" + escH(t("mixRow1", { a: 100 - sh, p: money(g, q.mix.base) })) + "</span><b>" + money(g, rr((1 - q.mix.share) * q.mix.base)) + "</b></li><li><span>" +
        escH(t("mixRow2", { g: pick(M.direction(cfg, S.dir2).t), b: sh, p: money(g, q.mix.gfx) })) + "</span><b>" + money(g, rr(q.mix.share * q.mix.gfx)) + "</b></li></ul><p>" + escH(t("mixNote", { a: 100 - sh, b: sh })) + "</p>";
    } else mp.classList.add("hidden");

    var ow = $("owner");
    if (OWNER && q.floor !== null) {
      ow.classList.remove("hidden");
      ow.innerHTML = "<h3>" + t("o.h") + "</h3>" + ownerBlock(q, g, m === "single" ? "" : t("sPilot"), true).replace(/^<h3><\/h3>/, "") + (mq ? "<hr>" + ownerBlock(mq, g, t("o.month"), false) : "");
    }

    var inc = cfg.includes, list = [inc.common[0]];
    if (q.research) list = list.concat(inc.research);
    list = list.concat(d.code ? inc.code : inc.ai, inc.common.slice(1));
    var outTxt = pick(d.out);
    $("outLine").textContent = t("out") + ": " + outTxt.charAt(0).toLowerCase() + outTxt.slice(1);
    $("incList").innerHTML = list.map(function (x) { return "<li>" + escH(pick(x)) + "</li>"; }).join("");
    $("notList").innerHTML = inc.excluded.map(function (x) { return "<li>" + escH(pick(x)) + "</li>"; }).join("");
    $("volHint").textContent = "";
    explain2(q, d, g);
    $("pbValue").textContent = money(g, q.total);
    updatePricebar();

    lastFields = {};
    lastFields[t("send.market")] = g === "RU" ? t("mruh") : t("mwest");
    lastFields[t("send.type")] = isMix() ? t("g.mix") : t("g." + S.grp);
    lastFields[t("send.dir")] = pick(d.t) + (q.mix ? " + " + pick(M.direction(cfg, S.dir2).t) + " (" + Math.round(q.mix.share * 100) + "%)" : "");
    lastFields[t("send.len")] = m === "single" ? cnt + " × " + durText(q.durSec) : durText(q.durSec);
    if (d.look.show) lastFields[t("send.look")] = lookLab;
    if (d.hero.show) lastFields[t("send.hero")] = heroLab;
    if (q.research) lastFields[t("send.research")] = t("yes");
    lastFields[t("send.mode")] = t("mode." + m);
    if (m === "single") lastFields[t("send.total")] = money(g, q.total) + " (" + money(g, q.perVideo) + " " + t("perv") + ")";
    else {
      lastFields[t("sPilot")] = money(g, q.total) + " (" + q.count + ")";
      lastFields[t("sMonth")] = money(g, mq.total) + " (" + mq.count + ")";
      lastFields[t("send.total")] = money(g, all.total) + " (" + N + ")";
    }
    lastBreak = shown.map(function (l) { return "— " + lineLabel(l, d.hide_gen) + ": " + (l.value < 0 ? "−" : "") + money(g, Math.abs(l.value)); });
    lastText = [t("send.h"), ""].concat(Object.keys(lastFields).map(function (k) { return k + ": " + lastFields[k]; }), [""], lastBreak).join("\n");

    if (S.maxStep >= 2) { try { localStorage.setItem("calcLast", JSON.stringify({ t: Date.now(), short: lastFields[t("send.dir")] + ", " + lastFields[t("send.len")] + ": " + (m === "single" ? money(g, q.total) : t("send.total") + " " + lastFields[t("send.total")]), text: lastText })); } catch (e) {} }
    try { window.parent.postMessage({ type: "pricing-calc-height", height: document.documentElement.scrollHeight }, "*"); } catch (e) {}
    window.__lastQuote = q; window.__lastSeries = lastQ;
  }

  /* ——— навигация по шагам ——— */
  function refreshStep() {
    ["1", "2", "3"].forEach(function (k) { $("st" + k).classList.toggle("hidden", !(S.step === +k && !S.free)); });
    $("stFree").classList.toggle("hidden", !S.free);
    $("hero").classList.toggle("hidden", S.step !== 1 || S.free);
    $("aboutTop").classList.toggle("hidden", S.step !== 1 || S.free);
    var picked = isMix() ? !!S.tpl : !!S.dir;
    $("aboutTop").classList.toggle("compact", !!S.dir);
    $("dirBox").classList.toggle("has", picked);
    $("dirBox").classList.toggle("hasp", picked && !isMix());
    $("tabBox").classList.toggle("compact", picked);
    $("presetWrap").classList.toggle("hidden", picked);
    $("softExit").classList.toggle("hidden", S.free);
    $("softLink").textContent = t(BRIEF() ? "softLinkBrief" : "softLinkFree");
    $("softLink").setAttribute("href", BRIEF() || "#");
    $("wsteps").classList.toggle("hidden", S.free);
    Array.prototype.forEach.call(document.querySelectorAll(".ws"), function (b) {
      var n = +b.dataset.go;
      b.classList.toggle("cur", n === S.step);
      b.classList.toggle("done", n !== S.step && n <= S.maxStep && (n === 1 || !!S.dir));
      if (n === S.step) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    var back = $("btnBack"), next = $("btnNext");
    if (S.free) { back.classList.remove("hidden"); back.textContent = t("backCalc"); next.classList.add("hidden"); }
    else {
      back.classList.toggle("hidden", S.step === 1); back.textContent = t("back");
      next.classList.toggle("hidden", S.step === 3);
      next.textContent = t(S.step === 1 ? "next1" : "next2");
      next.disabled = S.step === 1 && !S.dir;
    }
    // блок отправки живёт на шаге 3, а в режиме «опишите задачу» переезжает под поле текста
    var send = $("send");
    if (S.free) $("freeHost").appendChild(send); else $("st3").insertBefore(send, $("procBlk"));
    $("t-sendNum").textContent = t(S.free ? "sendNumFree" : "sendNum");
    showSendMode();
    render();
  }
  function go(n, quiet) {
    if (n === 2 && !S.dir) n = 1;
    if (n === 3 && (!S.dir || S.maxStep < 2)) n = S.dir ? 2 : 1;
    S.free = false; S.step = n; S.maxStep = Math.max(S.maxStep, n);
    refreshStep();
    if (!quiet) { try { history.pushState({ s: n }, "", "#step" + n); } catch (e) {} window.scrollTo({ top: Math.max(0, $("wsteps").getBoundingClientRect().top + window.scrollY - 76), behavior: "smooth" }); goal("calc_step" + n); }
  }
  function openFree() {
    S.free = true; refreshStep(); goal("calc_free");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  function applyPreset(p) {
    var s = p.set, d = M.direction(cfg, s.direction);
    S.grp = d.group; S.dir = d.id; S.tpl = null;
    buildTabs(); buildDirections(); buildQuestions(true); syncDuration(true);
    $("dur").value = s.durSec;
    buildModes(); document.querySelector('input[name="mode"][value="' + (s.mode === "series" ? "series" : "single") + '"]').checked = true;
    if (s.mode === "series") { $("perMonth").value = s.perMonth; $("contractTotal").value = s.contractTotal; } else $("count").value = s.count;
    syncMode();
    /* состав «под ключ»: герой, права, версии, правки, ресерч и модули продвижения; у остальных пресетов всё это сбрасывается */
    var pick1 = function (name, v) { var r = document.querySelector('input[name="' + name + '"][value="' + v + '"]'); if (r) r.checked = true; };
    if (s.hero != null) pick1("hero", s.hero ? "yes" : "no");
    if (s.look) pick1("look", s.look);
    if ($("research")) $("research").checked = !!s.research;
    var md = s.modules || {};
    $("rights").value = s.rights || "base"; $("vers").value = s.versions || 0; $("revs").value = s.revs || 0;
    $("m_strategy").checked = !!md.strategy; $("m_packaging").checked = !!md.packaging; $("m_ad_setup").checked = !!md.adSetup;
    $("m_publishing").value = md.publishingMonths || 0; $("m_report").value = md.reportMonths || 0;
    $("moreBox").open = !!(s.rights || s.versions || s.revs || Object.keys(md).length);
    S.maxStep = Math.max(S.maxStep, 2); go(2); goal("calc_preset");
  }
  function pickTab(id) {
    if (id === S.grp) return;
    S.grp = id; S.tpl = null;
    var allowed = id === "mix" ? [] : cfg.catalog.directions.filter(function (d) { return d.group === id; }).map(function (d) { return d.id; });
    if (S.dir && allowed.indexOf(S.dir) < 0) S.dir = null;
    buildTabs(); buildDirections();
    if (S.dir) { buildQuestions(true); syncDuration(true); } else $("qBox").innerHTML = "";
    refreshStep();
  }

  /* ——— события ——— */
  $("form").addEventListener("input", function (e) {
    var n = e.target.name, id = e.target.id;
    if (n === "tpl") { applyMixTpl(e.target.value); return; }
    if (n === "dir") { S.dir = e.target.value; if (isMix()) setCustomTpl(); buildQuestions(true); syncDuration(true); refreshStep(); return; }
    if (n === "dir2") { S.dir2 = e.target.value; setCustomTpl(); refreshMixHints(); refreshStep(); return; }
    if (id === "mixShare") { S.share = +e.target.value; $("mixShareLbl").textContent = t("mixShareLbl", { p: S.share }); setCustomTpl(); refreshMixHints(); render(); return; }
    if (n === "mode") syncMode();
    if (n === "grid") { buildDirections(); buildPromo(); }
    if (id === "comment" || id === "freeText") return;
    render();
  });
  $("form").addEventListener("click", function (e) {
    var tb = e.target.closest(".tab");
    if (tb) { pickTab(tb.dataset.grp); return; }
    var st = e.target.closest("[data-step]");
    if (st) { var el = $(st.dataset.step); var v = (+el.value || 0) + (+st.dataset.d); var mn = +el.min || 0, mx = +el.max || 9999; el.value = Math.min(Math.max(v, mn), mx); render(); return; }
  });
  $("presetBox").addEventListener("click", function (e) {
    var pr = e.target.closest("[data-preset]");
    if (pr) applyPreset(cfg.presets.filter(function (p) { return p.id === pr.dataset.preset; })[0]);
  });
  $("wsteps").addEventListener("click", function (e) { var b = e.target.closest(".ws.done"); if (b) go(+b.dataset.go); });
  $("btnNext").addEventListener("click", function () { if (S.step === 1 && !S.dir) return; go(S.step + 1); });
  $("btnBack").addEventListener("click", function () { if (S.free) { S.free = false; refreshStep(); window.scrollTo({ top: 0, behavior: "smooth" }); } else go(S.step - 1); });
  $("freeLink").addEventListener("click", openFree);
  /* адрес брифа задаёт сборка для русского сайта; без него ссылка открывает заявку своими словами */
  function BRIEF() { var b = (typeof CALC_FIX !== "undefined" && CALC_FIX && CALC_FIX.brief) || ""; return b ? b + "?src=calc" + (qs.get("from") === "ai" ? "&from=ai" : "") : ""; }
  $("softLink").addEventListener("click", function (e) { goal(BRIEF() ? "calc_to_brief" : "calc_free"); if (!BRIEF()) { e.preventDefault(); openFree(); } });
  $("pbBtn").addEventListener("click", function (e) { e.preventDefault(); $("rail").scrollIntoView({ behavior: "smooth" }); });
  window.addEventListener("popstate", function () { var m = /#step(\d)/.exec(location.hash); go(m ? +m[1] : 1, true); });
  $("send").addEventListener("input", function (e) {
    if (e.target.name === "how") { how = e.target.value; buildHow(); }
    $("f-contact").classList.remove("err");
  });
  $("langbtn").addEventListener("click", function (e) { e.preventDefault(); lang = lang === "en" ? "ru" : "en"; applyLang(); syncDuration(false); refreshStep(); });

  /* ——— заявка ——— */
  function leadParts() {
    var contact = $("f-contact").value.trim(), name = $("f-name").value.trim();
    var f = {}, text;
    if (S.free) {
      var task = $("freeText").value.trim();
      f[t("send.task")] = task;
      text = t("send.free") + "\n\n" + t("send.task") + ": " + task;
    } else {
      f = Object.assign({}, lastFields);
      var cm = $("comment").value.trim();
      if (cm) f[t("send.comment")] = cm;
      text = lastText + (cm ? "\n\n" + t("send.comment") + ": " + cm : "");
    }
    if (name) f[t("send.name")] = name;
    if (contact) f[t("send.contact")] = T[lang].howT[how] + ": " + contact;
    text += (name || contact ? "\n\n" + (name ? t("send.name") + ": " + name + "\n" : "") + (contact ? t("send.contact") + ": " + T[lang].howT[how] + " " + contact : "") : "") + "\n\n" + location.href;
    return { fields: f, text: text, contact: contact };
  }
  var hasEndpoints = function () { return !!(window.LEAD && (window.LEAD.TG_ENDPOINT || window.LEAD.FORM_ENDPOINT) && typeof window.sendLead === "function"); };
  function freeOk() { if (S.free && !$("freeText").value.trim()) { var ta = $("freeText"); ta.classList.add("err"); ta.focus(); return false; } return true; }
  $("freeText").addEventListener("input", function () { $("freeText").classList.remove("err"); });
  $("send-tg").addEventListener("click", async function () {
    var btn = $("send-tg"), hint = $("sendhint");
    if (!freeOk()) return;
    var lp = leadParts();
    goal("calc_submit");
    if (hasEndpoints()) {
      if (!lp.contact) { var c = $("f-contact"); c.classList.add("err"); c.focus(); return; }
      btn.disabled = true; hint.textContent = t("sending");
      var res = { sent: [] };
      try { res = await window.sendLead(lp.fields, lp.text); } catch (e) {}
      if (res.sent && res.sent.length) {
        $("send").innerHTML = '<div class="done"><div class="mark">✓</div><h2>' + escH(t("doneT")) + '</h2><p class="sub" style="margin:12px auto 0">' + escH(t("doneS")) + "</p></div>";
        return;
      }
      btn.disabled = false;
    }
    var copied = false;
    try { await navigator.clipboard.writeText(lp.text); copied = true; } catch (e) {}
    hint.innerHTML = copied ? t("copied") : t("nocopy");
    window.open((window.LEAD && window.LEAD.TG_CHAT) || "https://t.me/semyran", "_blank", "noopener");
  });
  /* ссылки Gmail и Яндекс.Почты собираются заново в момент нажатия: к тому времени человек мог добавить услуги и комментарий */
  $("mailLine").addEventListener("click", function (e) {
    var a = e.target.closest("a"), kit = window.SendKit; if (!a || !kit) return;
    var lp = leadParts(), subj = t(S.free ? "send.free" : "send.h");
    if (/mail.google/.test(a.href)) a.href = kit.gmail(subj, lp.text); else if (/mail.yandex/.test(a.href)) a.href = kit.yandex(subj, lp.text);
  });
  /* почта, PDF, «поделиться»: без сервера (js/send.js). brief_submit-аналог для калькулятора это calc_submit, считаем любую попытку */
  function viaGoal(ch) { goal("calc_submit"); goal("calc_via_" + ch); }
  $("send-mail").addEventListener("click", function () {
    if (!freeOk()) return;
    var lp = leadParts(), kit = window.SendKit; viaGoal("mail");
    location.href = kit.mailto(t(S.free ? "send.free" : "send.h"), lp.text);
    $("sendhint").textContent = t("mailHint");
  });
  $("send-pdf").addEventListener("click", function () {
    if (!freeOk()) return;
    var kit = window.SendKit; viaGoal("pdf");
    if (S.free) kit.pdf({ heading: t("pdfHeadFree"), filename: t("pdfFileFree"), locale: lang === "en" ? "en-US" : "ru-RU", author: lang === "en" ? "Serafim Panyushkin" : "Серафим Панюшкин", rows: [[t("send.task"), $("freeText").value.trim()]] });
    else {
      var rows = Object.keys(lastFields).map(function (k) { return [k, lastFields[k]]; }), cm = $("comment").value.trim();
      if (cm) rows.push([t("send.comment"), cm]);
      kit.pdf({ heading: t("pdfHead"), filename: t("pdfFile"), locale: lang === "en" ? "en-US" : "ru-RU", author: lang === "en" ? "Serafim Panyushkin" : "Серафим Панюшкин", rows: rows, text: lastBreak.join("\n") });
    }
    $("sendhint").textContent = t("pdfHint", { mail: kit.mail });
  });
  $("send-share").addEventListener("click", async function () {
    if (!freeOk()) return;
    var lp = leadParts(); viaGoal("share"); await window.SendKit.share(t(S.free ? "send.free" : "send.h"), lp.text);
  });
  $("send-copy").addEventListener("click", async function () {
    if (!freeOk()) return;
    var lp = leadParts(); goal("calc_copy");
    try { await navigator.clipboard.writeText(lp.text); $("sendhint").textContent = t("copiedOnly"); } catch (e) { $("sendhint").textContent = t("nocopy"); }
  });

  /* плашка с ценой на телефоне: прячем, когда правая колонка на экране */
  try {
    var io = new IntersectionObserver(function (es) { railSeen = es[0].isIntersecting; updatePricebar(); }, { threshold: 0.15 });
    io.observe($("sum"));
  } catch (e) {}

  if (OWNER) { $("specialBox").classList.remove("hidden"); $("owner").classList.remove("hidden"); }
  var FIX = (typeof CALC_FIX !== "undefined" && CALC_FIX) || {};
  var gp = qs.get("grid"), stored = null; try { stored = localStorage.getItem("calcLang"); } catch (e) {}
  lang = qs.get("lang") === "en" || qs.get("lang") === "ru" ? qs.get("lang") : (stored === "en" ? "en" : "ru");
  if (gp === "RU" || gp === "WEST") document.querySelector('input[name="grid"][value="' + gp + '"]').checked = true;
  else if (lang === "en") document.querySelector('input[name="grid"][value="WEST"]').checked = true;
  /* отдельный калькулятор для русского или английского сайта: язык и рынок зафиксированы, переключателей нет */
  if (FIX.lang) { lang = FIX.lang; $("langbtn").classList.add("hidden"); }
  if (FIX.grid) { document.querySelector('input[name="grid"][value="' + FIX.grid + '"]').checked = true; $("marketBox").classList.add("hidden"); }
  var pd = qs.get("dir"); if (pd && M.direction(cfg, pd)) { S.dir = pd; S.grp = M.direction(cfg, pd).group; }
  try { if (/#step/.test(location.hash)) history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  applyLang(); syncDuration(true); refreshStep();
  goal("calc_open");
  window.addEventListener("resize", function () { render(); });
})();
</script>
</body>
</html>
